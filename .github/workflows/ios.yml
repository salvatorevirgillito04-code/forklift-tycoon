# Compila l'app iOS NON firmata (.ipa) su un Mac di GitHub.
# La firma la fa SideStore/Sideloadly sull'iPhone di chi la installa, con il suo Apple ID gratuito.
name: iOS IPA (non firmato)

on:
  push:
    branches: [main]
    paths: ['ios/**', 'src/**', 'public/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr forklift-tycoon.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: forklift-tycoon-ipa
          path: forklift-tycoon.ipa
          retention-days: 30
